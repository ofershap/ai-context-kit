name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Merge dependabot PR whose head commit just went green
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha }}"
          PR_NUMBER="$(gh pr list --state open --author "dependabot[bot]" --json number,headRefOid --jq ".[] | select(.headRefOid == \"$SHA\") | .number" | head -n1)"
          if [ -z "$PR_NUMBER" ]; then
            echo "No open dependabot PR at $SHA - nothing to merge."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
